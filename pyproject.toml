[project]
classifiers = ["Private :: Do Not Upload"]
name = "payment-processing"
version = "0.1.0"
description = "Payment processing serivce for Secunda org as test task"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"alembic>=1.18.5",
	"fastapi>=0.139.0",
	"faststream[rabbit]>=0.7.1",
	"httpx2>=2.5.0",
	"pybreaker>=1.4.1",
	"sqlalchemy[postgresql-asyncpg]>=2.0.51",
	"structlog>=26.1.0",
	"tenacity>=9.1.4",
	"uvicorn>=0.50.2",
	"uvloop>=0.22.1",
	"validators>=0.35.0",
]

[dependency-groups]
dev = [
	"aiosqlite>=0.22.1",
	"black>=26.5.1",
	"mypy>=2.2.0",
	"pytest-asyncio>=1.4.0",
	"pytest-cov>=7.1.0",
	"python-dotenv>=1.2.2",
	"ruff>=0.15.20",
]


#################################
#  LSP
#################################
[tool.pyrefly]
project-includes = ["./src/"]
project-excludes = ["**/.[!/.]*", "**/tests"]
search-path = ["./src/"]
site-package-path = [".venv/lib/python3.*/site-packages"]
python-platform = "linux"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
line-ending = "auto"
docstring-code-format = false
skip-magic-trailing-comma = false

#################################
#  TESTS
#################################

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["tests"]
addopts = "-v -s --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

#################################
#  BUILD
#################################

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payments"
module-root = "src"
